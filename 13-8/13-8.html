<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;           
            padding: 30px;        
            border: 10px solid black; 
            margin: 50px;             

            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <h2>Content</h2>
        <p>This is the content area.</p>
        <p>Padding, Border and Margin surround this box.</p>
    </div>

</body>
</html>
